<script
  src="http://localhost:8000/embed.js"
  data-site="myblog"
  data-page="/examples/demo"
  data-scheme="light"
  data-theme="nord"
  data-css="embed.css"
  data-theme-css="theme.css"
></script>

<!-- data-css and data-theme-css point at ./embed.css and ./theme.css, served
     alongside this page on :3000 — self-hosted copies instead of the ones at
     :8000/embed.css and :8000/themes/nord.css.

     To also self-host embed.js itself (all three files downloaded, only the
     API stays on :8000), swap the tag above for this one instead:

     <script
       src="embed.js"
       data-api="http://localhost:8000"
       data-site="myblog"
       data-page="/examples/demo"
       data-scheme="light"
       data-theme="nord"
       data-css="embed.css"
       data-theme-css="theme.css"
     ></script>
