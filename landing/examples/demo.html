<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hilo Demo</title>
    <meta
      name="description"
      content="A live demo of the Hilo comment widget."
    />

    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../styles.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/hilo_comments/embed.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/hilo_comments/themes/nord.css"
    />
  </head>

  <body>
    <header class="site-nav">
      <div class="container site-nav__inner">
        <a class="brand" href="../index.html"
          >hilo<span class="brand__dot">.</span></a
        >

        <div class="site-nav__actions">
          <a class="btn btn--ghost nav__cta" href="../index.html"
            >&larr; Back to Hilo</a
          >
        </div>
      </div>
    </header>

    <main>
      <section
        class="hero"
        style="padding-block: var(--space-2xl) var(--space-xl)"
      >
        <div class="container">
          <p class="hero__eyebrow">live demo</p>

          <h1 class="hero__title" style="font-size: var(--text-3xl)">
            Just some blog post
          </h1>

          <p class="hero__lede">
            The widget below is the real thing, talking to the hosted API — sign
            in with GitHub and leave a comment. Same
            <code>&lt;script&gt;</code> tag as in the
            <a
              href="https://github.com/byandrev/hilo#the-widget"
              target="_blank"
              rel="noopener noreferrer"
              >README</a
            >.
          </p>
        </div>
      </section>

      <section style="padding-block: 0 var(--space-4xl)">
        <div class="container">
          <script
            src="https://cdn.jsdelivr.net/npm/hilo_comments/embed.js"
            data-site="myblog"
            data-page="/examples/demo"
            data-api="https://hilo-comments.vercel.app"
          ></script>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <span class="site-footer__brand"
          >hilo<span class="brand__dot">.</span></span
        >

        <span class="site-footer__credit">
          <a href="../index.html">Back to Hilo</a> ·
          <a href="https://github.com/byandrev/hilo">GitHub</a>
        </span>
      </div>
    </footer>
  </body>
</html>
